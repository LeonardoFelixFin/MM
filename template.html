<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas a Receber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&display=swap">
<style>
/* Contas a Receber · AZZAS 2154 | Shoes & Bags — versão oficial (Vera)
   Casca: topo marinho + abas. Cada aba roda isolada num iframe (srcdoc) a partir dos <template> abaixo. */
:root{--navy:#1D2B3F;--font:"Raleway","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#FFFFFF;font:14px/1.5 var(--font);display:flex;flex-direction:column;overflow:hidden}
body.escuro{background:#101827}
header{background:var(--navy);color:#F1EEE8;border-bottom:1px solid #2A3A52;flex:none}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.hrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:14px 4px}
.lg{height:40px;width:auto;display:block}
.hsep{width:1px;height:28px;background:rgba(241,238,232,.35)}
.app{font-size:12.5px;font-weight:500;letter-spacing:3.2px;text-transform:uppercase;margin-right:auto}
.portal{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#C9CED6;text-decoration:none}
.portal:hover{color:#fff}
.tema{display:flex;gap:14px}
.tema button{font:inherit;background:none;border:0;cursor:pointer;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#A9B2C0;border-bottom:1px solid transparent;padding:2px 0}
.tema button[aria-pressed="true"]{color:#fff;border-bottom-color:#C99A5B}
nav{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#A9B2C0;text-decoration:none;font-size:13px;padding:10px 0 12px;border-bottom:1.5px solid transparent;white-space:nowrap}
nav a:hover{color:#fff}
nav a[aria-current="page"]{color:#fff;font-weight:600;border-bottom-color:#C99A5B}
nav a[hidden]{display:none}
:focus-visible{outline:1.5px solid #C99A5B;outline-offset:3px}
#abas{flex:1;position:relative;min-height:0}
#abas iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
#abas iframe[hidden]{display:none}
.filtros{flex:none;border-bottom:1px solid #E3E6EB;background:#FFFFFF}
body.escuro .filtros{background:#101827;border-bottom-color:#26324A}
.fl-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 26px;padding-block:12px 10px}
.fl{display:flex;flex-direction:column;gap:2px;min-width:130px}
.fl span{font-size:9.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#6F7480}
.fl select{appearance:none;-webkit-appearance:none;font:13px var(--font);color:#1D2B3F;background:transparent;border:0;border-bottom:1px solid #E3E6EB;padding:3px 18px 4px 0;cursor:pointer;max-width:220px;
  background-image:linear-gradient(45deg,transparent 50%,#6F7480 50%),linear-gradient(135deg,#6F7480 50%,transparent 50%);background-position:calc(100% - 7px) 10px,calc(100% - 3px) 10px;background-size:4px 4px;background-repeat:no-repeat}
.fl select.on{border-bottom-color:#B8874B;font-weight:600}
body.escuro .fl select{color:#F1EEE8;border-bottom-color:#26324A}
body.escuro .fl select option{background:#101827}
#f_limpar{font:600 10.5px var(--font);letter-spacing:1.3px;text-transform:uppercase;color:#3B4658;background:none;border:0;border-bottom:1px solid #B8874B;padding:2px 0;cursor:pointer;margin-bottom:4px}
body.escuro #f_limpar{color:#C9CED6}
.fl-nota{flex-basis:100%;font-size:11px;color:#6F7480}
.fl-nota:empty{display:none}
.semdados{max-width:640px;margin:80px auto;padding:0 24px;font-size:15px;line-height:1.7;color:#3B4658}
.semdados b{font-size:20px;font-weight:500;color:#1D2B3F}.semdados code{background:#EEF1F5;padding:1px 6px;border-radius:4px;font-size:13px}.semdados span{color:#6F7480;font-size:13px}
body.escuro .semdados{color:#C9CED6}body.escuro .semdados b{color:#F1EEE8}body.escuro .semdados code{background:#1E2A3D}
.filtros[hidden]{display:none}
@media (max-width:600px){.lg{height:30px}.portal{display:none}.fl{min-width:calc(50% - 14px)}}
</style>
<script>
/* ================== DADOS ==================
   O app.py troca o comentário abaixo pelo JSON do contrato (ver K4 / resumo para o Stark).
   Sem dados (null), todas as abas abrem com dados fictícios e o selo "Dados fictícios". */
window.DADOS = /*__DADOS_JSON__*/null;
/* Endereço do Portal Financeiro (hub) */
window.PORTAL_URL = "https://portal-financeiro.databricksapps.com";
</script>
</head>

  --bg:#FFFFFF; --ink:#1D2B3F; --ink2:#3B4658; --muted:#6F7480; --line:#E3E6EB; --soft:#F7F8FA;
  --acc:#B8874B; --red:#C0452B; --green:#1E8449; --navy:#1D2B3F;
  --s-hoje:#1D2B3F; --s-mes:#B8874B; --s-ano:#C3CAD5; --track:#EEF1F5;
  --font:"Raleway","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
body.escuro{
  --bg:#101827; --ink:#F1EEE8; --ink2:#C9CED6; --muted:#8F98A6; --line:#26324A; --soft:#162133;
  --acc:#C99A5B; --red:#FF6A4D; --green:#4FD08F;
  --s-hoje:#E9E4DA; --s-mes:#C99A5B; --s-ano:#4A5A73; --track:#1E2A3D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
:focus-visible{outline:1.5px solid var(--acc);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* topo */
header{background:var(--navy);color:#F1EEE8;border-bottom:1px solid #2A3A52}
.hrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:14px 4px}
.lg{height:40px;width:auto;display:block}
.hsep{width:1px;height:28px;background:rgba(241,238,232,.35)}
.app{font-size:12.5px;font-weight:500;letter-spacing:3.2px;text-transform:uppercase;margin-right:auto}
.portal{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#C9CED6;text-decoration:none}
.portal:hover{color:#fff}
.tema{display:flex;gap:14px}
.tema button{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#A9B2C0;border-bottom:1px solid transparent;padding:2px 0}
.tema button[aria-pressed="true"]{color:#fff;border-bottom-color:#C99A5B}
nav{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#A9B2C0;text-decoration:none;font-size:13px;padding:10px 0 12px;border-bottom:1.5px solid transparent;white-space:nowrap}
nav a.on{color:#fff;font-weight:600;border-bottom-color:#C99A5B}
nav a.off{opacity:.45;cursor:default}

/* faixa da posição */
.pos{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:18px 16px;border-bottom:1px solid var(--line)}
.pos b{font-weight:600}
.pos .txt{color:var(--ink2)}
.selo{display:inline-block;padding:1px 7px;border:1px solid var(--acc);color:var(--acc);font-size:9px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;border-radius:2px;white-space:nowrap}
.selo.fict{border-color:var(--red);color:var(--red);margin-left:auto}

/* seções */
section{padding-top:36px}
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px}
.sh .n{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--acc)}
.sh h2{margin:0;font-size:21px;font-weight:400;letter-spacing:-.1px}
.sh .sub{margin-left:auto;font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr}
.cols>*{min-width:0;padding-right:34px}
.cols>*+*{padding-left:34px;padding-right:0;border-left:1px solid var(--line)}

/* cartões · opção A (manchete) */
.kpis{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);border-bottom:1px solid var(--line);padding-bottom:20px}
.lbl{font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.i{color:var(--acc);cursor:help;font-size:11px;margin-left:3px;letter-spacing:0}
.hero{display:flex;align-items:center;gap:26px;padding-right:34px;border-right:1px solid var(--line)}
svg.gauge{flex:none;width:150px;max-width:40%;height:auto}
.big{font-size:clamp(60px,6vw,84px);font-weight:300;line-height:.95;letter-spacing:-2px;color:var(--red);margin-top:4px}
.big small{font-size:.4em;font-weight:400;letter-spacing:0;margin-left:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;cursor:default}
.chip em{font-style:normal;font-weight:500;opacity:.75}
.chip.up{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.chip.down{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.chip.neu{background:var(--track);color:var(--ink2)}
.rows{padding-left:34px;display:grid}
.r{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.val{font-size:26px;font-weight:400;white-space:nowrap}
.val small{font-size:13px;color:var(--muted);margin-left:3px}
.val sup{font-size:12px;color:var(--muted);vertical-align:top;position:relative;top:6px;margin-right:4px}
.cc{display:flex;gap:6px}
.r .sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* gráficos */
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--font)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.foot{font-size:12px;color:var(--muted);margin:10px 0 0}

/* tabela */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1080px}
th{font-size:9.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 9px 14px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{text-align:right;padding:11px 0 11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
th:first-child,td:first-child{padding-left:0;width:28px}
td.op b{font-weight:600}
td.op span{display:block;font-size:11px;color:var(--muted)}
.plus{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;color:var(--acc);border-bottom:1px dotted var(--acc);cursor:help}
.bar{display:inline-block;width:56px;height:4px;border-radius:2px;background:var(--track);vertical-align:middle;margin-left:8px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:2px}
tfoot td{border-bottom:0;font-weight:600;font-size:13.5px;padding-top:12px}
tr:hover td{background:var(--soft)}

/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.12);max-width:280px}
#tip b{font-weight:700}

footer{padding-block:28px 40px;font-size:11px;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){.grow{animation:grow .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}.growx{transform-origin:left center}.growy{transform-origin:bottom center}
@keyframes grow{from{transform:scale(.001,1)}}.growy{animation-name:growy}@keyframes growy{from{transform:scale(1,.001)}}}

@media (max-width:1060px){.kpis{grid-template-columns:1fr}.hero{border-right:0;padding:0 0 18px;border-bottom:1px solid var(--line)}.rows{padding:8px 0 0}.cols{grid-template-columns:1fr}.cols>*{padding-left:0;padding-right:0}.cols>*+*{border-left:0}}
@media (max-width:600px){.hero{flex-direction:column;align-items:flex-start;gap:10px}.r{grid-template-columns:1fr auto}.r .cc{grid-column:1/-1}.lg{height:30px}.portal{display:none}.sh .sub{margin-left:0}}

/* ===== aba Devedores ===== */
.dk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);padding-bottom:22px}
.dk>div{padding:0 26px;border-left:1px solid var(--line);min-width:0}
.dk>div:first-child{border-left:0;padding-left:0}
.nv{font-size:clamp(34px,3.4vw,48px);font-weight:300;line-height:1;margin:12px 0 8px;letter-spacing:-1px;white-space:nowrap}
.nv small{font-size:.38em;font-weight:500;color:var(--muted);letter-spacing:0}
.nv.red,.red{color:var(--red)}
.ns{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mb{display:inline-block;width:64px;height:5px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.mb i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:3px}
.busca input{font:13px var(--font);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 0;width:280px;outline:none}
.busca input:focus{border-bottom-color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
th[data-k]{cursor:pointer;user-select:none}
th[data-k]:hover,th.on{color:var(--ink)}
th .ar{color:var(--acc);margin-left:4px;font-size:8px}
tr.cl{cursor:pointer}
.mais{display:flex;justify-content:center;padding-top:16px}
.mais button{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--acc);padding:2px 0}
.growxl{transform-origin:right center}
/* ficha */
.modal{position:fixed;inset:0;z-index:40;background:rgba(16,24,39,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.on{display:flex}
.box{background:var(--bg);color:var(--ink);width:100%;max-width:1000px;border-radius:8px;padding:26px 30px 30px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{display:flex;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px}
.mh h3{margin:4px 0 2px;font-size:26px;font-weight:400}
.msub{font-size:12px;color:var(--muted)}
.x{margin-left:auto;font-size:26px;line-height:1;color:var(--muted)}
.x:hover{color:var(--ink)}
.mk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.mk>div{padding:0 18px;border-left:1px solid var(--line)}.mk>div:first-child{border-left:0;padding-left:0}
.mv{font-size:22px;font-weight:400;margin-top:6px;white-space:nowrap}
.mv.green{color:var(--green)}
.sh.sm{margin:18px 0 10px;padding-bottom:6px}.sh.sm h2{font-size:15px;font-weight:500}
table.mt{min-width:560px}
tr.lj{cursor:pointer}tr.lj.open td{background:var(--soft)}
tr.tt td{font-size:12px;color:var(--ink2);padding-top:7px;padding-bottom:7px;background:var(--soft)}
tr.tt td:first-child{padding-left:22px}
.tg{color:var(--acc);display:inline-block;width:12px}
@media (max-width:1060px){.dk{grid-template-columns:1fr 1fr;row-gap:22px}.dk>div:nth-child(3){border-left:0;padding-left:0}.mk{grid-template-columns:repeat(3,1fr);row-gap:14px}.mk>div:nth-child(4){border-left:0;padding-left:0}}
@media (max-width:600px){.dk{grid-template-columns:1fr}.dk>div{border-left:0!important;padding:0!important}.busca input{width:100%}.box{padding:20px 16px}}

.d{font-weight:600}.d.up{color:var(--red)}.d.down{color:var(--green)}.d.neu{color:var(--ink2)}
#tb{min-width:1040px;font-size:12.5px}
#tb th,#tb td{padding-left:10px}
#tb th{letter-spacing:.8px}
#tb td.op{white-space:normal;min-width:170px;max-width:230px}

/* ===== aba Cobradoras ===== */
.selx{margin-left:auto;display:inline-flex;align-items:center}
.sh .sub+.selx{margin-left:18px}
.selx select{appearance:none;-webkit-appearance:none;font:13px var(--font);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:3px 18px 4px 0;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 7px) 10px,calc(100% - 3px) 10px;background-size:4px 4px;background-repeat:no-repeat}
.selx select:focus{border-bottom-color:var(--acc);outline:none}
.selx select option{background:var(--bg);color:var(--ink)}
#tb{min-width:1060px;font-size:12.5px}
#tb th,#tb td{padding-left:10px}#tb th{letter-spacing:.8px}
#tb td .sm{display:block;font-size:11px;color:var(--muted)}
#tb tr.cl{cursor:pointer}
#tb tr.sel td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;color:var(--ink2);background:var(--track)}
.rk.top{background:var(--s-hoje);color:var(--bg)}
.rk.bot{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
td.ctx{color:var(--muted);font-style:italic}
td.nota{min-width:104px;white-space:nowrap}
td.nota b{font-size:15px;margin-right:8px}
.nb{display:inline-block;width:60px;height:5px;border-radius:3px;background:var(--track);vertical-align:middle;position:relative;overflow:hidden}
.nb i{position:absolute;inset:0 auto 0 0;border-radius:3px}
tr.sem td{color:var(--ink2);border-top:1px dashed var(--line);font-weight:400;font-size:12.5px}
tr.eq td{font-weight:600;border-top:1px solid var(--ink);background:none}
.como{display:grid;grid-template-columns:120px 1fr;gap:6px 20px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.como ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px;color:var(--ink2)}
.como em{font-style:normal;color:var(--acc);font-weight:600}
.como .lim{grid-column:2;margin:6px 0 0;font-size:11.5px;color:var(--muted)}
@media (max-width:600px){.como{grid-template-columns:1fr}.como .lim{grid-column:1}.selx{margin-left:0}}

const fm1=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const fm2=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const mi=n=>"R$ "+fm1(n)+" mi";
const mil=n=>"R$ "+Math.round(n).toLocaleString("pt-BR")+" mil";
const pct=(n,d=1)=>n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const sgn=(n,f)=>(n>0?"+":n<0?"−":"")+f(Math.abs(n));
const dt=iso=>new Date(iso+"T00:00");
const dBR=iso=>dt(iso).toLocaleDateString("pt-BR");
const dia=iso=>dt(iso).toLocaleDateString("pt-BR",{weekday:"long"}).replace("-feira","");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS="http://www.w3.org/2000/svg";
function el(t,a,p,tx){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;if(p)p.appendChild(e);return e}
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();

/* tooltip */
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){tip.style.opacity=0;return}
  tip.innerHTML=t.getAttribute("data-tip");tip.style.opacity=1;
  const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-10),y=e.clientY+tip.offsetHeight+24>innerHeight?e.clientY-tip.offsetHeight-12:e.clientY+14;
  tip.style.left=x+"px";tip.style.top=y+"px"});

function cabecalho(){
  document.getElementById("p_data").textContent=dBR(D.posicao)+" ("+dia(D.posicao)+")";
  document.getElementById("p_comp").textContent=dBR(D.posicao).slice(0,5);
  document.getElementById("cmp_sub").textContent="mês = "+dBR(D.mesAnt)+" · ano = "+dBR(D.anoAnt)+" (mesmo dia útil)";
}

function kpis(){
  const C=D.carteira,V=D.vencido,A={hoje:C.hoje-V.hoje,mes:C.mes-V.mes,ano:C.ano-V.ano},P={hoje:V.hoje/C.hoje*100,mes:V.mes/C.mes*100,ano:V.ano/C.ano*100};
  const rel=(o,k)=>(o.hoje/o[k]-1)*100;
  const cls=(d,bad)=>!bad?"neu":(d>0?"up":"down");
  const seta=d=>d>0?"▲":d<0?"▼":"■";
  const chip=(o,k,bad,pp)=>{const d=pp?o.hoje-o[k]:rel(o,k),ref=pp?pct(o[k],2):mi(o[k]);
    return `<span class="chip ${cls(d,bad)}" data-tip="${k==="mes"?"Mês anterior · "+dBR(D.mesAnt):"Ano anterior · "+dBR(D.anoAnt)}<br>${ref}">${seta(d)} ${pp?sgn(d,fm2)+" p.p.":sgn(d,fm1)+"%"} <em>${k==="mes"?"mês":"ano"}</em></span>`};
  const I=t=>`<span class="i" data-tip="${t}">ⓘ</span>`;
  const g=(p)=>{const sz=150,st=14,r=sz/2-st/2-1,c=Math.PI*r,len=c*Math.min(1,p/20),x0=st/2+1,x1=sz-st/2-1;
    return `<svg class="gauge" width="${sz}" height="${sz/2+st+2}" viewBox="0 0 ${sz} ${sz/2+st+2}" aria-hidden="true"><path d="M${x0},${sz/2} A${r},${r} 0 0 1 ${x1},${sz/2}" fill="none" stroke="var(--track)" stroke-width="${st}" stroke-linecap="round"/><path d="M${x0},${sz/2} A${r},${r} 0 0 1 ${x1},${sz/2}" fill="none" stroke="var(--red)" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${len} ${c}"/><text x="${x0}" y="${sz/2+st+1}" font-size="9" fill="var(--muted)">0%</text><text x="${x1}" y="${sz/2+st+1}" font-size="9" fill="var(--muted)" text-anchor="end">20%</text></svg>`};
  document.getElementById("kpis").innerHTML=
   `<div class="hero">${g(P.hoje)}<div><div class="lbl">% Inadimplência ${I("Vencido ÷ carteira")}</div><div class="big">${fm2(P.hoje)}<small>%</small></div><div class="chips">${chip(P,"mes",1,1)}${chip(P,"ano",1,1)}</div></div></div>
    <div class="rows">
      <div class="r"><div><div class="lbl">Vencido ${I("Vencimento líquido até a data da posição (regra do SAP)")}</div><div class="sub">${mi(D.compensacao)} em compensação ${I("Vence no dia da posição; o crédito entra no próximo dia útil.")}</div></div><div class="val"><sup>R$</sup>${fm1(V.hoje)}<small>mi</small></div><div class="cc">${chip(V,"mes",1)}${chip(V,"ano",1)}</div></div>
      <div class="r"><div class="lbl">A vencer ${I("Carteira − vencido")}</div><div class="val"><sup>R$</sup>${fm1(A.hoje)}<small>mi</small></div><div class="cc">${chip(A,"mes",0)}${chip(A,"ano",0)}</div></div>
      <div class="r"><div class="lbl">Carteira ${I("Todo o em aberto · canais 40, 50 e 70")}</div><div class="val"><sup>R$</sup>${fm1(C.hoje)}<small>mi</small></div><div class="cc">${chip(C,"mes",0)}${chip(C,"ano",0)}</div></div>
    </div>`;
}

function aging(){
  const s=document.getElementById("ch_aging");s.innerHTML="";
  const W=600,H=300,L=40,R=6,T=26,B=36,S=[["hoje","Hoje · "+dBR(D.posicao).slice(0,5),"--s-hoje"],["mes","Mês anterior · "+dBR(D.mesAnt).slice(0,5),"--s-mes"],["ano","Ano anterior · "+dBR(D.anoAnt).slice(0,5),"--s-ano"]];
  document.getElementById("lg_aging").innerHTML=S.map(x=>`<span><i style="background:var(${x[2]})"></i>${x[1]}</span>`).join("");
  const tot={};S.forEach(([k])=>tot[k]=D.aging[k].reduce((a,b)=>a+b,0));
  const pc=k=>D.aging[k].map(v=>v/tot[k]*100);
  const P={hoje:pc("hoje"),mes:pc("mes"),ano:pc("ano")};
  const hi=Math.ceil(Math.max(...Object.values(P).flat())/5)*5, y=v=>T+(hi-v)/hi*(H-T-B), n=D.faixas.length, band=(W-L-R)/n, bw=Math.min(18,band*.24);
  for(let t=0;t<=hi;t+=5){el("line",{x1:L,x2:W-R,y1:y(t),y2:y(t),stroke:css("--line"),"stroke-dasharray":t?"2 5":""},s);el("text",{x:L-8,y:y(t)+4,"text-anchor":"end","font-size":10.5,fill:css("--muted")},s,t+"%")}
  D.faixas.forEach((f,i)=>{
    const cx=L+band*i+band/2;
    S.forEach(([k,nome,cv],j)=>{
      const v=P[k][i],x=cx+(j-1)*(bw+3)-bw/2,top=y(v),h=y(0)-top,r=Math.min(4,bw/2);
      const p=el("path",{d:`M${x},${y(0)} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y(0)} Z`,fill:css(cv),class:"grow growy",style:`animation-delay:${i*.05}s`,
        "data-tip":`<b>${f} dias · ${nome.split(" · ")[0]}</b><br>${pct(v)} do vencido<br>${mi(D.aging[k][i])}`},s);
      el("text",{x:x+bw/2,y:top-5,"text-anchor":"middle","font-size":k==="hoje"?9.5:8.5,"font-weight":k==="hoje"?700:500,fill:k==="hoje"?css("--ink"):css("--muted")},s,Math.round(v)+"%");
    });
    el("text",{x:cx,y:H-14,"text-anchor":"middle","font-size":10.5,fill:css("--muted")},s,f);
  });
  el("text",{x:L+band*n,y:H-1,"text-anchor":"end","font-size":9.5,fill:css("--muted"),"letter-spacing":".6"},s,"DIAS DE ATRASO");
  const p90=k=>P[k].slice(4).reduce((a,b)=>a+b,0);
  document.getElementById("ft_aging").innerHTML=`Acima de 90 dias: <b>${pct(p90("hoje"))}</b> do vencido hoje, contra ${pct(p90("mes"))} no mês anterior e ${pct(p90("ano"))} no ano anterior. Passe o mouse para ver o valor em R$.`;
}

function marcas(){
  const s=document.getElementById("ch_marca");s.innerHTML="";
  const M=[...D.marcas].sort((a,b)=>b.v-a.v), tv=M.reduce((a,b)=>a+b.v,0);
  const W=600,rowH=42,T=24,H=T+M.length*rowH+8; s.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const L=150, BW=226, X2=L+BW+84, DW=W-X2-14, mx=Math.max(...M.map(m=>m.v)), dmax=Math.ceil(Math.max(...M.map(m=>m.v/m.c*100))/5)*5;
  el("text",{x:L,y:12,"font-size":9.5,fill:css("--muted"),"letter-spacing":"1.2"},s,"VENCIDO (R$) · % DO TOTAL");
  el("text",{x:X2,y:12,"font-size":9.5,fill:css("--muted"),"letter-spacing":"1.2"},s,"% INADIMPLÊNCIA");
  const pm=D.vencido.hoje/D.carteira.hoje*100, xd=v=>X2+v/dmax*DW;
  M.forEach((m,i)=>{
    const yc=T+i*rowH+rowH/2, w=m.v/mx*BW, p=m.v/m.c*100;
    el("text",{x:0,y:yc+4,"font-size":10.5,"font-weight":600,"letter-spacing":"1.2",fill:css("--ink")},s,m.n.toUpperCase());
    el("rect",{x:L,y:yc-6,width:BW,height:12,rx:6,fill:css("--track")},s);
    el("rect",{x:L,y:yc-6,width:w,height:12,rx:6,fill:css("--s-hoje"),class:"grow growx",style:`animation-delay:${i*.06}s`,
      "data-tip":`<b>${m.n}</b><br>Vencido ${mi(m.v)} · ${pct(m.v/tv*100)} do total<br>Carteira ${mi(m.c)}`},s);
    el("text",{x:L+w+8,y:yc+4,"font-size":12,"font-weight":600,fill:css("--ink")},s,fm1(m.v));
    el("text",{x:L+w+8+String(fm1(m.v)).length*7.4,y:yc+4,"font-size":10.5,fill:css("--muted")},s,"  "+pct(m.v/tv*100));
    el("line",{x1:X2,x2:X2+DW,y1:yc,y2:yc,stroke:css("--line")},s);
    const c=p>pm?css("--red"):css("--green");
    el("circle",{cx:xd(p),cy:yc,r:9,fill:c,"fill-opacity":.15},s);
    el("circle",{cx:xd(p),cy:yc,r:4.5,fill:c,"data-tip":`<b>${m.n}</b><br>${pct(p)} da carteira da marca está vencida<br>média geral ${pct(pm)}`},s);
    el("text",{x:xd(p)+(xd(p)>X2+DW-40?-12:12),y:yc+4,"text-anchor":xd(p)>X2+DW-40?"end":"start","font-size":11,"font-weight":600,fill:c},s,pct(p));
  });
  el("line",{x1:xd(pm),x2:xd(pm),y1:T-2,y2:H-6,stroke:css("--acc"),"stroke-dasharray":"3 3"},s);
  el("text",{x:xd(pm),y:H+6,"text-anchor":"middle","font-size":9.5,fill:css("--acc")},s,"média "+pct(pm));
  document.getElementById("ft_marca").innerHTML=`Ponto em vermelho: marca acima da inadimplência média (${pct(pm)}); em verde, abaixo.`;
}

function tabela(){
  const T=D.top, tv=D.vencido.hoje*1000, s10=T.reduce((a,b)=>a+b.v,0);
  const lista=(arr,rot)=>arr.length>1?`${esc(arr[0])}<span class="plus" data-tip="<b>${rot}</b><br>${arr.map(esc).join('<br>')}">+${arr.length-1}</span>`:esc(arr[0]);
  const mesNome=dt(D.posicao).toLocaleDateString("pt-BR",{month:"2-digit"});
  let h=`<thead><tr><th class="l">#</th><th class="l">Operador / loja</th><th class="l">Marca</th><th class="l">Canal</th><th class="l">Cobrador</th><th>Vencido</th><th>% do total</th><th>> 90 dias</th><th>Δ mês anterior</th><th data-tip="Títulos com vencimento de 01/${mesNome} a 30/${mesNome}, pagos ou não">Vence no mês ⓘ</th><th data-tip="Só dinheiro, de qualquer vencimento">Liquidado até ${dBR(D.posicao).slice(0,5)} ⓘ</th><th>A vencer</th></tr></thead><tbody>`;
  T.forEach((r,i)=>{
    const d=r.v-r.ant, p=r.v/tv*100;
    h+=`<tr><td class="l">${i+1}</td><td class="l op"><b>${esc(r.op)}</b><span>${r.lj} loja${r.lj>1?"s":""}</span></td><td class="l">${lista(r.marcas,"Marcas")}</td><td class="l">${esc(r.canal)}</td><td class="l">${listaCob(r.cobs)}</td>
      <td><b>${mil(r.v)}</b></td><td>${pct(p)}<span class="bar"><i style="width:${Math.min(100,p/4*100)}%"></i></span></td>
      <td style="color:${r.v90/r.v>.5?"var(--red)":"inherit"}">${r.v90?mil(r.v90):"—"}</td>
      <td class="d ${d>0?"up":d<0?"down":"neu"}">${d?sgn(d,x=>Math.round(x).toLocaleString("pt-BR"))+" mil":"—"}</td>
      <td>${r.vm?mil(r.vm):"—"}</td><td>${r.liq?mil(r.liq):"—"}</td><td>${r.av?mil(r.av):"—"}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td></td><td class="l" colspan="4">Os 10 maiores somam <span style="color:var(--acc)">${pct(s10/tv*100)}</span> do vencido</td><td>${mil(s10)}</td><td>${pct(s10/tv*100)}</td><td colspan="5"></td></tr></tfoot>`;
  document.getElementById("tb").innerHTML=h;
}

const COBS=["Ana Ribeiro","Bruna Teixeira","Carla Moraes","Maria Eduarda Albuquerque Vasconcellos","SEM NOME (047)","SEM COBRADOR"];
const FX=["Até 10","10–30","31–60","61–90","91–180","181–360","> 360"];
const cnpj=()=>{const d=()=>Math.floor(rnd()*10);let s="";for(let i=0;i<14;i++)s+=d();return s.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5")};
const CLI=[];const usados=new Set();
for(let i=0;i<1480;i++){
  let nome;do{nome=pick(N1)+" "+pick(N2)+(rnd()<.6?" "+pick(N3):"")}while(usados.has(nome)&&usados.size<1400);usados.add(nome);
  const v=Math.round(1700*Math.pow(i+1,-0.92)*(0.75+rnd()*0.5)*10)/10;            // R$ mil, cauda longa
  const p90=rnd()<.42?rnd()*0.95:0, v90=Math.round(v*p90*10)/10;
  const nm=1+Math.floor(Math.pow(rnd(),2.2)*4), ms=[...MARCAS].sort(()=>rnd()-.5).slice(0,nm);
  const nc=rnd()<.15?2:1, cs=[...COBS].sort(()=>rnd()-.5).slice(0,nc);
  const ant=Math.max(0,Math.round(v*(0.55+rnd()*0.9)*10)/10);
  const lj=1+Math.floor(Math.pow(rnd(),2.5)*8);
  CLI.push({cod:String(100000+Math.floor(rnd()*899999)),cnpj:cnpj(),nome,lj,marcas:ms,canal:rnd()<.55?"Franquias":rnd()<.9?"Multimarcas":"E-commerce",cobs:cs,
    neg:rnd()<.2,v,v90,ant,vm:Math.round(v*rnd()*0.8*10)/10,liq:rnd()<.3?0:Math.round(v*rnd()*0.7*10)/10,av:rnd()<.12?0:Math.round(v*(0.4+rnd()*1.8)*10)/10});
}
if(DADOS&&DADOS.devedores){CLI.length=0;CLI.push(...DADOS.devedores.clientes)}
CLI.sort((a,b)=>b.v-a.v);

const fm1=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const int=n=>Math.round(n).toLocaleString("pt-BR");
const mil=n=>"R$ "+int(n)+" mil";
const miK=n=>"R$ "+fm1(n/1000)+" mi";
const rs=n=>n>=1000?miK(n):mil(n);
const pct=(n,d=1)=>n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const sgn=(n,f)=>(n>0?"+":n<0?"−":"")+f(Math.abs(n));
const dt=iso=>new Date(iso+"T00:00"), dBR=iso=>dt(iso).toLocaleDateString("pt-BR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS="http://www.w3.org/2000/svg";
function el(t,a,p,tx){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;if(p)p.appendChild(e);return e}
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
let TV=CLI.reduce((a,c)=>a+c.v,0);

/* 01 · quatro números */
function numeros(){
  const n=CLI.length, t10=CLI.slice(0,10).reduce((a,c)=>a+c.v,0);
  let acc=0,n80=0;for(const c of CLI){acc+=c.v;n80++;if(acc>=TV*.8)break}
  const c90=CLI.filter(c=>c.v90>0), v90=c90.reduce((a,c)=>a+c.v90,0);
  const I=t=>`<span class="i" data-tip="${t}">ⓘ</span>`;
  const mini=p=>`<span class="mb"><i style="width:${Math.min(100,p)}%"></i></span>`;
  document.getElementById("dk").innerHTML=
   `<div><div class="lbl">Clientes com vencido ${I("Quantidade de lojas com vencido maior que zero (vira operador quando o SORTL estiver no Databricks)")}</div><div class="nv">${int(n)}</div><div class="ns">vencido total ${miK(TV)}</div></div>`+
   `<div><div class="lbl">Concentração ${I("% do vencido nos 10 maiores clientes")}</div><div class="nv">${pct(t10/TV*100)}</div><div class="ns">${mini(t10/TV*100)} nos 10 maiores · ${miK(t10)}</div></div>`+
   `<div><div class="lbl">Quantos fazem 80% ${I("Quantos clientes, do maior para o menor, somam 80% do vencido")}</div><div class="nv">${int(n80)}<small> de ${int(n)}</small></div><div class="ns">${mini(n80/n*100)} ${pct(n80/n*100)} dos clientes</div></div>`+
   `<div><div class="lbl">Com saldo acima de 90 dias ${I("Clientes com algum título vencido há mais de 90 dias")}</div><div class="nv red">${int(c90.length)}</div><div class="ns"><b class="red">${miK(v90)}</b> · ${pct(v90/TV*100)} do vencido</div></div>`;
  return n80;
}

/* 02 · Pareto */
function pareto(n80){
  const s=document.getElementById("ch_par");s.innerHTML="";
  const W=600,H=320,L=42,R=14,T=14,B=44,n=CLI.length,x=p=>L+p/100*(W-L-R),y=p=>T+(100-p)/100*(H-T-B);
  const g=el("defs",{},s),lg=el("linearGradient",{id:"gp",x1:0,y1:0,x2:0,y2:1},g);
  el("stop",{offset:0,"stop-color":css("--s-hoje"),"stop-opacity":.18},lg);el("stop",{offset:1,"stop-color":css("--s-hoje"),"stop-opacity":0},lg);
  [0,25,50,75,100].forEach(t=>{el("line",{x1:L,x2:W-R,y1:y(t),y2:y(t),stroke:css("--line"),"stroke-dasharray":t?"2 5":""},s);el("text",{x:L-8,y:y(t)+4,"text-anchor":"end","font-size":10.5,fill:css("--muted")},s,t+"%");
    el("text",{x:x(t),y:H-24,"text-anchor":t===0?"start":t===100?"end":"middle","font-size":10.5,fill:css("--muted")},s,t+"%")});
  el("text",{x:(L+W-R)/2,y:H-4,"text-anchor":"middle","font-size":9.5,"letter-spacing":".8",fill:css("--muted")},s,"% DOS CLIENTES, DO MAIOR PARA O MENOR");
  let acc=0,d=`M${x(0)},${y(0)}`;const pts=[];
  CLI.forEach((c,i)=>{acc+=c.v;const px=(i+1)/n*100,py=acc/TV*100;if(i<60||i%8===0||i===n-1){d+=` L${x(px).toFixed(1)},${y(py).toFixed(1)}`;pts.push([px,py,i+1])}});
  el("path",{d:d+` L${x(100)},${y(0)} Z`,fill:"url(#gp)"},s);
  el("path",{d,fill:"none",stroke:css("--s-hoje"),"stroke-width":2.2,"stroke-linejoin":"round"},s);
  el("line",{x1:L,x2:W-R,y1:y(80),y2:y(80),stroke:css("--red"),"stroke-dasharray":"5 4"},s);
  el("text",{x:W-R,y:y(80)-6,"text-anchor":"end","font-size":10.5,"font-weight":600,fill:css("--red")},s,"80% do vencido");
  const p80=n80/n*100;
  el("line",{x1:x(p80),x2:x(p80),y1:y(0),y2:y(80),stroke:css("--acc"),"stroke-dasharray":"3 3"},s);
  el("circle",{cx:x(p80),cy:y(80),r:5,fill:css("--acc")},s);
  el("text",{x:x(p80)+9,y:y(80)+18,"font-size":12,"font-weight":700,fill:css("--ink")},s,int(n80)+" clientes");
  el("text",{x:x(p80)+9,y:y(80)+32,"font-size":10.5,fill:css("--muted")},s,pct(p80)+" da base");
  pts.forEach(([px,py,k])=>el("circle",{cx:x(px),cy:y(py),r:6,fill:"transparent","data-tip":`<b>${int(k)} maiores clientes</b><br>${pct(px)} da base · ${pct(py)} do vencido`},s));
  document.getElementById("ft_par").innerHTML=`<b>${int(n80)}</b> de ${int(n)} clientes (${pct(p80)}) concentram 80% do vencido. Os 10 maiores sozinhos somam ${pct(CLI.slice(0,10).reduce((a,c)=>a+c.v,0)/TV*100)}.`;
}

/* 03 · quem piorou / melhorou */
function movimentos(){
  const s=document.getElementById("ch_mov");s.innerHTML="";
  document.getElementById("mv_sub").textContent="variação do vencido vs "+dBR(MESANT)+" (mesmo dia útil)";
  const dd=CLI.map(c=>({...c,d:c.v-c.ant}));
  const up=[...dd].sort((a,b)=>b.d-a.d).slice(0,10), dn=[...dd].sort((a,b)=>a.d-b.d).slice(0,10);
  const W=600,rh=23,T=26,mid=300,half=150, mx=Math.max(...up.map(c=>c.d),...dn.map(c=>-c.d));
  const H=T+10*rh*2+40; s.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const bar=(c,i,bloco)=>{
    const yc=T+bloco*(10*rh+30)+i*rh+rh/2, w=Math.abs(c.d)/mx*half, piorou=c.d>0, cor=piorou?css("--red"):css("--green");
    const x=piorou?mid:mid-w;
    el("rect",{x,y:yc-7,width:Math.max(2,w),height:14,rx:3,fill:cor,"fill-opacity":.85,class:"grow "+(piorou?"growx":"growxl"),
      "data-tip":`<b>${esc(c.nome)}</b><br>${mil(c.ant)} → ${mil(c.v)}<br>${sgn(c.d,int)} mil · ${esc(c.cobs[0]||"SEM COBRADOR")}`},s);
    const lx=piorou?mid-10:mid+10;
    el("text",{x:lx,y:yc+4,"text-anchor":piorou?"end":"start","font-size":11.5,fill:css("--ink")},s,c.nome.length>30?c.nome.slice(0,29)+"…":c.nome);
    el("text",{x:piorou?mid+w+6:mid-w-6,y:yc+4,"text-anchor":piorou?"start":"end","font-size":11,"font-weight":700,fill:cor},s,sgn(c.d,int));
  };
  el("text",{x:mid+4,y:T-10,"font-size":9.5,"font-weight":600,"letter-spacing":"1.4",fill:css("--red")},s,"PIORARAM · R$ MIL →");
  up.forEach((c,i)=>bar(c,i,0));
  el("text",{x:mid-4,y:T+10*rh+20,"text-anchor":"end","font-size":9.5,"font-weight":600,"letter-spacing":"1.4",fill:css("--green")},s,"← MELHORARAM · R$ MIL");
  dn.forEach((c,i)=>bar(c,i,1));
  el("line",{x1:mid,x2:mid,y1:T-4,y2:H-6,stroke:css("--line")},s);
}

/* 04 · tabela completa */
const COLS=[
  {k:"rk",h:"#",l:1},{k:"nome",h:"Operador / loja",l:1},{k:"marca",h:"Marca",l:1},{k:"canal",h:"Canal",l:1},{k:"cob",h:"Cobrador",l:1},
  {k:"v",h:"Vencido"},{k:"p",h:"% do total"},{k:"v90",h:"> 90 dias"},{k:"d",h:"Δ mês anterior"},
  {k:"vm",h:"Vence no mês",tip:"Títulos com vencimento de 01/11 a 30/11, pagos ou não"},{k:"liq",h:"Liquidado até 04/11",tip:"Só dinheiro, de qualquer vencimento"},{k:"av",h:"A vencer"}];

function tabela(){
  const q=document.getElementById("q").value.trim().toLowerCase(), qd=q.replace(/\D/g,"");

    <td class="l">${lista(c.marcas,"Marcas")}</td><td class="l">${esc(c.canal)}</td><td class="l">${listaCob(c.cobs)}</td>
    <td><b>${mil(c.v)}</b></td><td>${pct(c.p,2)}</td><td style="color:${c.v90>c.v*.5?"var(--red)":"inherit"}">${c.v90?mil(c.v90):"—"}</td>
    <td class="d ${Math.abs(c.d)<.5?"neu":c.d>0?"up":"down"}">${Math.abs(c.d)>=.5?sgn(c.d,int)+" mil":"—"}</td><td>${c.vm?mil(c.vm):"—"}</td><td>${c.liq?mil(c.liq):"—"}</td><td>${c.av?mil(c.av):"—"}</td></tr>`).join("");
  document.getElementById("tb").innerHTML=`<thead><tr>${th}</tr></thead><tbody>${tb||`<tr><td colspan="12" class="l" style="padding:24px 0;color:var(--muted)">Nenhum cliente encontrado para “${esc(q)}”.</td></tr>`}</tbody>`;

document.getElementById("tb").addEventListener("click",e=>{
  const th=e.target.closest("th[data-k]");if(th){const k=th.dataset.k;ord=ord.k===k?{k,d:-ord.d}:{k,d:["nome","marca","canal","cob","rk"].includes(k)?1:-1};tabela();return}

/* ficha do cliente */
const modal=document.getElementById("modal");

window.aplicarFiltros=function(F){const B=window._BASE||(window._BASE=CLI.slice());
  const r=B.filter(c=>(!F.canal||c.canal===F.canal)&&(!F.marca||c.marcas.includes(F.marca))&&(!F.cobrador||(c.cobs.length?c.cobs:["SEM COBRADOR"]).includes(F.cobrador))&&(!F.neg||(F.neg==="S")===(!!c.neg)));
  CLI.length=0;CLI.push(...r);TV=CLI.reduce((a,c)=>a+c.v,0)||1;

<script>
/* ===================== DADOS FICTÍCIOS ===================== */
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const NOMES=["Ana Ribeiro","Bruna Teixeira","Carla Moraes","Denise Pires","Elisa Kunz","Fabiana Lopes","Gabriela Souto","Maria Eduarda Albuquerque Vasconcellos","SEM NOME (047)"];

const COB=NOMES.map((n,i)=>{
  const cart=18+rnd()*42, inad=0.06+rnd()*0.08, venc=cart*inad, p90=0.32+rnd()*0.3, q=0.6+rnd()*0.8;
  const mes={};MESES.forEach(([k])=>{mes[k]={rec:Math.min(.6,(0.14+rnd()*0.2)*q),rol:Math.max(.05,(0.6-rnd()*0.35)/q),cura:Math.min(.95,(0.45+rnd()*0.35)*Math.sqrt(q)),r90:(0.02+rnd()*0.08)*q,acd:venc*1000*(0.01+rnd()*0.05)}});
  const base=venc*1000*0.22*q;
  return {n,cart,venc,v90:venc*p90,mes,rec12:Array.from({length:12},(_,m)=>m===11?base*0.15*(0.8+rnd()*.4):base*(0.8+rnd()*0.4)*(m===2||m===3?0.85:1)),clis:Math.round(80+rnd()*420)};
});
const SEM={n:"Sem cobrador",cart:6.4,venc:1.9,v90:1.2,clis:57,acd:38};
if(DADOS&&DADOS.cobradoras){const X=DADOS.cobradoras;COB.length=0;COB.push(...X.lista);Object.assign(SEM,X.semCobrador||{});const SC=COB.findIndex(c=>c.n==="SEM COBRADOR");if(SC>=0){Object.assign(SEM,COB[SC]);COB.splice(SC,1)}SEM.n="SEM COBRADOR";if(X.meses)MESES.splice(0,MESES.length,...X.meses);if(X.rotulos12)M12.splice(0,12,...X.rotulos12)}
const RECMES=1000*COB.reduce((a,c)=>a+c.venc,0)*0.21*0.15/0.15; // ilustrativo
/* ========================================================== */

const fm1=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});

function notas(R){

      "data-tip":`<b>${esc(c.n)} · nota ${int(c.nota)}</b><br>Recuperação ${int(c.n_rec)} · Rolagem ${int(c.n_rol)}<br>Cura ${int(c.n_cura)} · Recup. &gt; 90 ${int(c.n_r90)}`},s);

  const src=FCOB?COB.filter(c=>c.n===FCOB):COB, v=Array.from({length:12},(_,m)=>src.reduce((a,c)=>a+c.rec12[m],0)/1000);

    el("path",{d:`M${cx-bw/2},${y(0)} V${top+r} Q${cx-bw/2},${top} ${cx-bw/2+r},${top} H${cx+bw/2-r} Q${cx+bw/2},${top} ${cx+bw/2},${top+r} V${y(0)} Z`,fill:last?css("--acc"):css("--s-hoje"),"fill-opacity":last?1:.88,class:"grow growy",style:`animation-delay:${i*.03}s`,

  document.getElementById("tb").innerHTML=h;

<script>
/* ===================== DADOS FICTÍCIOS ===================== */
const POS=new Date(((DADOS&&DADOS.posicao)||"2026-11-04")+"T00:00"), DIA=864e5;
const COBS=["Ana Ribeiro","Bruna Teixeira","Carla Moraes","Maria Eduarda Albuquerque Vasconcellos","SEM NOME (047)","SEM COBRADOR"];
const N1=["Grupo","Lojas","Casa","Boutique","Rede","Atelier","Maison","Studio","Empório","Passo","Vitrine","Ponto"];
const N2=["Pampa","Serra","Cerrado","Guaíba","Planalto","Missões","Vale","Pantanal","Litoral","Capital","Araucária","Coxilha","Ipê","Sinos","Lumière","Aurora","Bela Vista","Horizonte","Jacuí","Taquari"];
const N3=["Calçados","Shoes","Modas","Acessórios","Fashion","Store"];
const BAIRRO=["Centro","Shopping","Bairro","Outlet","Aeroporto","Praça","Norte","Sul"];
const MARCAS=["Arezzo","Schutz","Anacapri","Vicenza","Alexandre Birman","Brizza"];
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};const pick=a=>a[Math.floor(rnd()*a.length)];
const MP=(DADOS&&DADOS.meuPainel)||null;
const EQ=(MP&&MP.equipe)||{inad:.0935,rec:.229,f:[.034,.019,.0405]};
if(MP&&MP.cobradoras)COBS.splice(0,COBS.length,...MP.cobradoras);
COBS.splice(0,COBS.length,...ordCob(COBS));   // equipe: % da carteira em ≤30, 31–90, >90
function gerar(ci){
  if(MP&&MP.carteiras){const X=MP.carteiras[COBS[ci]]||{ops:[],rec:0};const dd=v=>v?new Date(v+"T00:00"):null;
    const ops=X.ops.map(o=>({...o,lojas:o.lojas.map(l=>({...l,tit:l.tit.map(t=>({...t,emis:dd(t.emis),venc:dd(t.venc),orig:dd(t.orig)}))}))}));
    return {ops,ini:{f:[0,0,0]},rec:X.rec||0,arvore:X.arvore||null}}
  seed=97+ci*131;
  const ops=[],nOps=70+Math.floor(rnd()*60);
  for(let o=0;o<nOps;o++){
    const nome=pick(N1)+" "+pick(N2)+(rnd()<.5?" "+pick(N3):""), canal=rnd()<.55?"Franquias":"Multimarcas";
    const ms=[...MARCAS].sort(()=>rnd()-.5).slice(0,1+Math.floor(Math.pow(rnd(),2)*3));
    const peso=Math.pow(rnd(),2.2), risco=rnd();
    const lojas=Array.from({length:1+Math.floor(Math.pow(rnd(),2.4)*5)},(_,l)=>{
      const cod=String(200000+Math.floor(rnd()*700000));
      const tit=Array.from({length:2+Math.floor(rnd()*6)},()=>{
        let d;const r=rnd();
        if(r<.42)d=-(1+Math.floor(rnd()*90));                 // a vencer
        else if(r<.47)d=-(1+Math.floor(rnd()*7));              // vence em 7 dias
        else if(r<.53)d=1;                                     // entrou em atraso ontem
        else if(r<.56)d=0;                                     // em compensação

        else{const r2=rnd()*(risco>.4?1:.7);d=r2<.36?1+Math.floor(rnd()*30):r2<.58?31+Math.floor(rnd()*60):91+Math.floor(rnd()*300)}
        const val=Math.round((0.6+rnd()*rnd()*45)*(0.4+peso*2.2)*(d<0?13:1)*10)/10;   // R$ mil · a vencer pesa mais na carteira
        const venc=new Date(POS-d*DIA), pr=rnd()<.12, orig=pr?new Date(venc-(10+Math.floor(rnd()*25))*DIA):null;
        const bl=rnd()<.06?"N":rnd()<.03?"R":"";
        return {doc:"99"+Math.floor(1e7+rnd()*9e7),tipo:bl==="N"&&canal==="Franquias"?"ZN":pick(["RV","RV","RV","RF","DR"]),emis:new Date(venc-(30+Math.floor(rnd()*90))*DIA),venc,orig,d,val,bl};
      });

    });
    const liq=Math.round(rnd()*rnd()*60*10)/10;
    ops.push({nome,cod:String(100000+Math.floor(rnd()*899999)),canal,ms,lojas,liq});
  }
  const ini={f:[0,0,0]};ops.forEach(o=>o.lojas.forEach(l=>l.tit.forEach(t=>{if(t.d>=0){const k=t.d<=30?0:t.d<=90?1:2;ini.f[k]+=t.val*(0.8+rnd()*0.45)}})));

const int=n=>Math.round(n).toLocaleString("pt-BR"), fm1=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});

function el(t,a,p,tx){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;if(p)p.appendChild(e);return e}

const LISTAS=[
  {k:"entrou",n:"Entrou em atraso",f:t=>t.entrou!=null?t.entrou:t.d===1,tip:"Venceu em 03/11 (ou no fim de semana/feriado antes) e continua em aberto. O que vence em 04/11 está em compensação e não entra."},
  {k:"v90",n:"Vira acima de 90 em 10 dias",f:t=>t.d>=80&&t.d<=89,tip:"Saldo entre 80 e 89 dias de atraso"},

  let cart=0,venc=0;const f=[0,0,0];

      if(t.d>=0){venc+=t.val;o._venc+=t.val;l._venc+=t.val;f[t.d<=30?0:t.d<=90?1:2]+=t.val;if(t.d>90)o._v90+=t.val;o._mx=Math.max(o._mx,t.d)}

      if(t.venc.getMonth()===10&&t.venc.getFullYear()===2026)o._vm+=t.val})})});
  return {cart,venc,f};

function numeros(A){
  const sum=(fn)=>{let v=0;const cs=new Set();G.ops.forEach(o=>o.lojas.forEach(l=>l.tit.forEach(t=>{if(fn(t)){v+=t.val;cs.add(o.cod)}})));return [v,cs.size]};

  const cmp=(a,b,maior)=>{const bom=maior?a>=b:a<=b;return `<span class="vs ${bom?"down":"up"}">${bom?"▼":"▲"} equipe ${pct(b)}</span>`};

   `<div><div class="lbl">Minha % inadimplência ${I("Meu vencido ÷ minha carteira")}</div><div class="nv ${mi>EQ.inad?"red":""}">${pct(mi,2)}</div><div class="ns">${cmp(mi,EQ.inad,0)}</div></div>`+
   `<div><div class="lbl">Entrou em atraso ${I(LISTAS[0].tip)}</div><div class="nv">${mil(ve)}</div><div class="ns"><b>${ce} clientes</b> · venceu em 03/11</div></div>`+
   `<div><div class="lbl">Viram acima de 90 em até 10 dias ${I("Meu saldo entre 80 e 89 dias de atraso")}</div><div class="nv red">${mil(v9)}</div><div class="ns"><b class="red">${c9} clientes</b> · 80 a 89 dias</div></div>`+
   `<div><div class="lbl">Minha recuperação no mês ${I("Meu recebido do vencido (só dinheiro) ÷ meu vencido do início do mês")}</div><div class="nv">${pct(G.rec)}</div><div class="ns">${cmp(G.rec,EQ.rec,1)}</div></div>`;
}

/* ===== Árvore da cobradora (fictícia, R$ mil) =====
   % = vencido ÷ carteira. Impacto do vencido = ΔV ÷ carteira anterior; de cada fluxo = fluxo ÷ carteira anterior.
   Impacto da carteira = V atual × (1/C atual − 1/C anterior); entrou = −V·E/(C0·C1), saiu = +V·S/(C0·C1). Os dois somam Δ%. */
const ARV0={
  dia:{rot:"no dia",ref:"vs 03/11",V0:575,C0:6195,novos:24,acordoParc:3,rec:9,neg:3,entrou:60,entrouVenc:12,entrouCli:3,saiu:35},
  mes:{rot:"no mês",ref:"vs 30/10",V0:520,C0:6050,novos:310,acordoParc:42,rec:205,neg:38,entrou:1180,entrouVenc:260,entrouCli:14,saiu:1010},
  estoqueNeg:64, avencerClisVencidos:1690
};
function calc(p){
  const V1=p.V0+p.novos-p.rec-p.neg, C1=p.C0+p.entrou-p.saiu, k=V1/(p.C0*C1);
  return {V1,C1,dP:V1/C1-p.V0/p.C0,dV:V1-p.V0,dC:C1-p.C0,
    iV:(V1-p.V0)/p.C0, iC:V1*(1/C1-1/p.C0),
    iNovos:p.novos/p.C0, iRec:-p.rec/p.C0, iNeg:-p.neg/p.C0, iEntrou:-p.entrou*k, iSaiu:p.saiu*k};
}
function arvore(A){
  const BASE=G.arvore||ARV0, sV=G.arvore?1:A.venc/587, sC=G.arvore?1:A.cart/6220, esc2=(p)=>({...p,V0:p.V0*sV,novos:p.novos*sV,acordoParc:p.acordoParc*sV,rec:p.rec*sV,neg:p.neg*sV,C0:p.C0*sC,entrou:p.entrou*sC,entrouVenc:p.entrouVenc*sC,saiu:p.saiu*sC});
  const ARV={dia:esc2(BASE.dia),mes:esc2(BASE.mes),estoqueNeg:BASE.estoqueNeg*sV,avencerClisVencidos:BASE.avencerClisVencidos*sC};
  const D=calc(ARV.dia), M=calc(ARV.mes), V=M.V1, C=M.C1, P=V/C, AV=C-V;
  const esc_=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const ppf=n=>(n>0?"+":n<0?"−":"")+Math.abs(n*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" p.p.";
  const rsf=n=>(n>0?"+":n<0?"−":"")+rs(Math.abs(n));
  const escuro=document.body.classList.contains("escuro");
  const K={ink:css("--ink"),mut:css("--muted"),line:css("--line"),bad:css("--red"),good:css("--green"),acc:css("--acc"),neu:css("--ink2"),
    g0:escuro?"#1E2A3D":"#FFFFFF",g1:escuro?"#162133":"#FAFBFC",g2:escuro?"#101827":"#F1F3F7",node:escuro?"#18243A":"#FFFFFF",dot:escuro?"#FFFFFF":"#1D2B3F",track:css("--track")};
  const cor=i=>Math.abs(i)<1e-5?K.neu:i>0?K.bad:K.good;
  const W=1340,H=780,cx=180,cy=H/2-10,R=122,SW=24;
  const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" fill="${o.c||K.ink}" font-size="${o.s||12}" font-weight="${o.w||400}" text-anchor="${o.a||"start"}" ${o.ls?`letter-spacing="${o.ls}"`:""}>${t}</text>`;
  let s=`<defs>
    <radialGradient id="bgG" cx="16%" cy="50%" r="95%"><stop offset="0" stop-color="${K.g0}"/><stop offset=".55" stop-color="${K.g1}"/><stop offset="1" stop-color="${K.g2}"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="${K.dot}" opacity="${escuro?.05:.06}"/></pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    ${[["rV",cor(M.iV)],["rC",cor(M.iC)]].map(([id,c])=>`<linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${c}" stop-opacity=".7"/><stop offset="1" stop-color="${c}" stop-opacity=".16"/></linearGradient>`).join("")}
  </defs>
  <rect width="${W}" height="${H}" rx="12" fill="url(#bgG)"/><rect width="${W}" height="${H}" rx="12" fill="url(#dots)"/>
  <circle cx="${cx}" cy="${cy}" r="${R+44}" fill="${P>EQ.inad?K.bad:K.acc}" opacity="${escuro?.08:.10}" filter="url(#soft)"/>`;
  // cabeçalhos de coluna
  const nx=380,nw=270, bx0=nx+nw+50;
  s+=T(cx,34,"INDICADOR PRINCIPAL",{c:K.mut,s:10,w:700,a:"middle",ls:1.6})+T(nx+nw/2,34,"É O RESULTADO DE",{c:K.mut,s:10,w:700,a:"middle",ls:1.6})+T(bx0+(W-30-bx0)/2,34,"O QUE MOVEU CADA PARTE",{c:K.mut,s:10,w:700,a:"middle",ls:1.6});
  // anel: círculo = carteira, arco = vencido
  const Cf=2*Math.PI*R;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${K.track}" stroke-width="${SW}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${P>EQ.inad?K.bad:K.acc}" stroke-width="${SW}" stroke-linecap="round" stroke-dasharray="${Cf*P} ${Cf}" transform="rotate(-90 ${cx} ${cy})" filter="url(#glow)" class="seg"/>`;
  // marcador da equipe
  const ae=-Math.PI/2+2*Math.PI*EQ.inad, ex=cx+(R+SW/2+6)*Math.cos(ae), ey=cy+(R+SW/2+6)*Math.sin(ae);
  s+=`<line x1="${cx+(R-SW/2-4)*Math.cos(ae)}" y1="${cy+(R-SW/2-4)*Math.sin(ae)}" x2="${ex}" y2="${ey}" stroke="${K.ink}" stroke-width="2"/>`+T(ex+6,ey+4,"equipe "+pct(EQ.inad,1),{c:K.mut,s:10.5,w:600});
  s+=T(cx,cy-30,"MINHA INADIMPLÊNCIA",{c:K.mut,s:10,w:700,a:"middle",ls:1.6});
  s+=T(cx,cy+16,pct(P,1),{s:46,w:300,a:"middle",c:P>EQ.inad?K.bad:K.ink});
  s+=T(cx-50,cy+44,"no dia",{c:K.mut,s:10,a:"middle"})+T(cx+50,cy+44,"no mês",{c:K.mut,s:10,a:"middle"});
  s+=T(cx-50,cy+62,ppf(D.dP),{c:cor(D.dP),s:12.5,w:700,a:"middle"})+T(cx+50,cy+62,ppf(M.dP),{c:cor(M.dP),s:12.5,w:700,a:"middle"});
  s+=T(cx,cy+R+52,"o círculo é a carteira; o arco é o vencido",{c:K.mut,s:10.5,a:"middle"});
  // nós Vencido e Carteira
  const nh=128, ys=[150,H-150-nh+20];
  const node=(y,nome,val,X,Y,imD,imM,rib)=>{
    const ycen=y+nh/2, w=Math.max(5,Math.abs(imM)*100*14), x0=cx+R+SW/2+4, y0=cy+(nome==="VENCIDO"?-24:24);
    s+=`<path class="rib" d="M${x0},${y0-w/2} C${x0+110},${y0-w/2} ${nx-110},${ycen-w/2} ${nx},${ycen-w/2} L${nx},${ycen+w/2} C${nx-110},${ycen+w/2} ${x0+110},${y0+w/2} ${x0},${y0+w/2} Z" fill="url(#${rib})"/>`;
    s+=`<rect class="nd" x="${nx}" y="${y}" width="${nw}" height="${nh}" rx="12" fill="${K.node}" stroke="${K.line}"/><rect x="${nx}" y="${y+16}" width="3" height="${nh-32}" rx="1.5" fill="${cor(imM)}"/>`;
    s+=T(nx+20,y+28,nome,{c:K.mut,s:10,w:700,ls:1.6})+T(nx+nw-16,y+28,ppf(imM)+" no mês",{c:cor(imM),s:10.5,w:700,a:"end"});
    s+=T(nx+20,y+62,val,{s:30,w:300});
    [["no dia",X,imD],["no mês",Y,imM]].forEach(([r,dv,im],j)=>{const xx=nx+20+j*(nw/2-6);
      s+=T(xx,y+88,r,{c:K.mut,s:9.5,w:600,ls:1})+T(xx,y+105,(dv>0?"↑ ":dv<0?"↓ ":"")+rsf(dv),{c:cor(im),s:12.5,w:700})+T(xx,y+120,ppf(im),{c:cor(im),s:11,w:600})});
    return ycen;
  };
  const yV=node(ys[0],"VENCIDO",rs(V),D.dV,M.dV,D.iV,M.iV,"rV");
  const yC=node(ys[1],"CARTEIRA",rs(C),D.dC,M.dC,D.iC,M.iC,"rC");
  // bolhas
  const all=[M.iNovos,M.iRec,M.iNeg,M.iEntrou,M.iSaiu].map(Math.abs), mx=Math.max(...all);
  const bub=(x,y,o)=>{const r=34;let k="";
    const glow=o.forte?`<circle cx="${x}" cy="${y}" r="${r+12}" fill="${o.c}" opacity=".12" filter="url(#soft)"/>`:"";
    k+=glow+`<circle cx="${x}" cy="${y}" r="${r+7}" fill="${K.node}" stroke="${K.line}" ${o.dash?'stroke-dasharray="4 4"':""}/>`;
    if(o.frac!=null){const c=2*Math.PI*r;k+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${K.track}" stroke-width="7"/><circle class="seg" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${o.c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*Math.min(1,o.frac)} ${c}" transform="rotate(-90 ${x} ${y})"/>`}
    k+=T(x,y+5,o.centro,{s:12.5,w:700,a:"middle",c:o.c});
    k+=T(x,y+r+26,o.nome,{s:12,w:700,a:"middle"});
    (o.linhas||[]).forEach((l,i)=>k+=T(x,y+r+43+i*15,l[0],{s:10.5,w:l[2]||500,a:"middle",c:l[1]||K.mut}));
    return `<g class="bub" data-tip="${esc_(o.tip||"")}">${k}</g>`;
  };
  const gap=(W-40-bx0)/4, bxs=i=>bx0+gap*i+gap/2, yb=[yV-10,yC-10];
  const lin=(y,n)=>{s+=`<line x1="${nx+nw}" y1="${y+10}" x2="${bxs(0)-41}" y2="${y+10-0}" stroke="${K.line}" stroke-width="1.2"/>`;for(let i=0;i<n-1;i++)s+=`<line x1="${bxs(i)+41}" y1="${y}" x2="${bxs(i+1)-41}" y2="${y}" stroke="${K.line}" stroke-dasharray="2 4"/>`};
  lin(yb[0],4);lin(yb[1],3);
  const fr=v=>Math.abs(v)/mx;
  s+=bub(bxs(0),yb[0],{nome:"Novos vencidos +",c:K.bad,frac:fr(M.iNovos),centro:ppf(M.iNovos).replace(" p.p.",""),forte:true,
    linhas:[[`mês ${rsf(ARV.mes.novos)}`],[`dia ${rsf(ARV.dia.novos)} (${ppf(D.iNovos)})`,K.bad,600],[`dos quais acordo ${rs(ARV.mes.acordoParc)}`,K.acc,700]],
    tip:"Títulos que venceram no período e não foram pagos. Parcelas de acordo que venceram também entram aqui."});
  s+=bub(bxs(1),yb[0],{nome:"Recebido −",c:K.good,frac:fr(M.iRec),centro:ppf(M.iRec).replace(" p.p.",""),
    linhas:[[`mês ${rsf(-ARV.mes.rec)}`],[`dia ${rsf(-ARV.dia.rec)} (${ppf(D.iRec)})`,K.good,600],["só dinheiro"]],tip:"Liquidado de títulos vencidos. Acordo não entra."});
  s+=bub(bxs(2),yb[0],{nome:"Negociado −",c:K.acc,frac:fr(M.iNeg),centro:ppf(M.iNeg).replace(" p.p.",""),
    linhas:[[`mês ${rsf(-ARV.mes.neg)}`],[`dia ${rsf(-ARV.dia.neg)} (${ppf(D.iNeg)})`,K.acc,600],["virou acordo, sem caixa"]],tip:"Baixa sem caixa: sai do vencido, mas não é recebimento."});
  s+=bub(bxs(3),yb[0],{nome:"Estoque em acordo",c:K.acc,dash:true,centro:pct(ARV.estoqueNeg/V,0),
    linhas:[[`${rs(ARV.estoqueNeg)} devendo`],["% do meu vencido"]],tip:"Negociados que ainda estão devendo: % do vencido"});
  s+=bub(bxs(0),yb[1],{nome:"Entrou −",c:K.good,frac:fr(M.iEntrou),centro:ppf(M.iEntrou).replace(" p.p.",""),
    linhas:[[`mês ${rsf(ARV.mes.entrou)}`],[`dia ${rsf(ARV.dia.entrou)} (${ppf(D.iEntrou)})`,K.good,600],[`${rs(ARV.mes.entrouVenc)} p/ já vencidos`,K.bad,700],[`${ARV.mes.entrouCli} clientes no mês`,K.bad,500]],
    tip:"Faturamento novo: aumenta a carteira e reduz o %. Em vermelho, o que foi vendido para quem já está vencido."});
  s+=bub(bxs(1),yb[1],{nome:"Saiu +",c:K.bad,frac:fr(M.iSaiu),centro:ppf(M.iSaiu).replace(" p.p.",""),
    linhas:[[`mês ${rsf(-ARV.mes.saiu)}`],[`dia ${rsf(-ARV.dia.saiu)} (${ppf(D.iSaiu)})`,K.bad,600]],tip:"Títulos que saíram da carteira: diminui a carteira e aumenta o %."});
  s+=bub(bxs(2),yb[1],{nome:"A vencer em risco",c:K.bad,dash:true,forte:true,frac:ARV.avencerClisVencidos/AV,centro:pct(ARV.avencerClisVencidos/AV,0),
    linhas:[["do a vencer em clientes"],["que já têm vencido",K.bad,700]],tip:"Alerta: parte do a vencer está em clientes que já têm títulos vencidos."});
  // rodapé
  s+=T(30,H-40,`Os impactos somam a variação do %:  vencido ${ppf(M.iV)}  +  carteira ${ppf(M.iC)}  =  ${ppf(M.dP)} no mês   ·   no dia ${ppf(D.iV)} + ${ppf(D.iC)} = ${ppf(D.dP)}`,{c:K.mut,s:11.5});
  const lg=[[K.bad,"piora o %"],[K.good,"melhora o %"],[K.acc,"acordo"]];
  lg.forEach(([c,t],i)=>{const x=W-330+i*105;s+=`<circle cx="${x}" cy="${H-44}" r="5" fill="${c}"/>`+T(x+10,H-40,t,{c:K.mut,s:11})});
  s+=T(30,H-20,"Anel menor de cada bolha = tamanho do impacto no mês, comparado com os demais. Passe o mouse para a explicação.",{c:K.mut,s:10.5});
  document.getElementById("arv").innerHTML=`<div class="art2"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Árvore da inadimplência da cobradora">${s}</svg></div>`;
}

function seg(){
  document.getElementById("seg").innerHTML=LISTAS.map(l=>`<button type="button" role="tab" aria-selected="${l.k===LST}" data-k="${l.k}" data-tip="${l.tip}">${l.n}</button>`).join("");
  document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{LST=b.dataset.k;seg();tabela()});
}

let ABERTOS=new Set();
function filtrar(){
  const L=LISTAS.find(l=>l.k===LST), q=Q.toLowerCase();
  return G.ops.map(o=>{const lojas=o.lojas.map(l=>({...l,sel:l.tit.filter(t=>L.f(t,o)&&(!q||o.nome.toLowerCase().includes(q)||l.nome.toLowerCase().includes(q)||t.doc.includes(q)||o.cod.includes(q)))})).filter(l=>l.sel.length);
    return {...o,lsel:lojas,nsel:lojas.reduce((a,l)=>a+l.sel.reduce((b,t)=>b+t.val,0),0)}}).filter(o=>o.lsel.length).sort((a,b)=>b.nsel-a.nsel);
}
function tabela(){
  const R=filtrar(),L=LISTAS.find(l=>l.k===LST);
  document.getElementById("lst_info").innerHTML=`<b>${R.length} operadores</b> · ${mil(R.reduce((a,o)=>a+o.nsel,0))} nesta lista`;
  let h=`<thead><tr><th class="l">Operador / loja</th><th class="l">Marca</th><th class="l">Canal</th><th>Na lista</th><th>Vencido</th><th>&gt; 90 dias</th><th data-tip="Vencimento de 01/11 a 30/11, pagos ou não">Vence no mês ⓘ</th><th data-tip="Só dinheiro, de qualquer vencimento">Liquidado até 04/11 ⓘ</th><th>A vencer</th><th>Maior atraso</th></tr></thead><tbody>`;
  if(!R.length)h+=`<tr><td class="l" colspan="10" style="padding:26px 0;color:var(--muted)">Nada nesta lista hoje${Q?" para “"+esc(Q)+"”":""}.</td></tr>`;
  R.slice(0,60).forEach(o=>{const ab=ABERTOS.has(o.cod);
    h+=`<tr class="op ${ab?"open":""}" data-o="${o.cod}" tabindex="0"><td class="l"><span class="tg">${ab?"▾":"▸"}</span><b>${esc(o.nome)}</b><span class="sm">${o.cod} · ${o.lojas.length} loja${o.lojas.length>1?"s":""}</span></td>
      <td class="l">${esc(o.ms[0])}${o.ms.length>1?`<span class="plus" data-tip="<b>Marcas</b><br>${o.ms.map(esc).join("<br>")}">+${o.ms.length-1}</span>`:""}</td><td class="l">${o.canal}</td>
      <td class="hl">${mil(o.nsel)}</td><td><b>${mil(o._venc)}</b></td><td style="color:${o._v90>o._venc*.5?"var(--red)":"inherit"}">${o._v90?mil(o._v90):"—"}</td><td>${o._vm?mil(o._vm):"—"}</td><td>${o.liq?mil(o.liq):"—"}</td><td>${o._av?mil(o._av):"—"}</td>
      <td style="color:${o._mx>90?"var(--red)":"inherit"}">${o._mx} d</td></tr>`;
    if(ab)o.lsel.forEach((l,li)=>{const lk=o.cod+"-"+li,abL=ABERTOS.has(lk);
      h+=`<tr class="lj ${abL?"open":""}" data-l="${lk}" tabindex="0"><td class="l" colspan="3"><span class="tg">${abL?"▾":"▸"}</span>${esc(l.nome)} <span class="sm in">${l.cod} · ${l.sel.length} título${l.sel.length>1?"s":""}</span></td><td class="hl">${mil(l.sel.reduce((a,t)=>a+t.val,0))}</td><td>${mil(l._venc)}</td><td colspan="5"></td></tr>`;
      if(abL){h+=`<tr class="th2"><td class="l" colspan="10"><div class="tt"><span>Documento</span><span>Tipo</span><span>Emissão</span><span>Vencimento</span><span>Dias</span><span>Valor</span><span>Bloqueio</span></div></td></tr>`;
        l.sel.sort((a,b)=>b.d-a.d).forEach(t=>{h+=`<tr class="ti"><td class="l" colspan="10"><div class="tt"><span>${t.doc}</span><span>${t.tipo}</span><span>${dBR(t.emis)}</span><span>${dBR(t.venc)}${t.orig?`<em data-tip="Prorrogado · vencimento original ${dBR(t.orig)}"> orig. ${dBR(t.orig).slice(0,5)}</em>`:""}</span>
          <span style="color:${t.d>90?"var(--red)":t.d<0?"var(--muted)":"inherit"}">${t.d<0?"vence em "+(-t.d)+" d":t.d===0?"compensação":t.d+" d"}</span><span><b>${mil(t.val)}</b></span><span>${t.bl?`<b class="blq" data-tip="${t.bl==="N"?"Negociado":"Reclamação"}">${t.bl}</b>`:"—"}</span></div></td></tr>`})}
    })});
  if(R.length>60)h+=`<tr><td class="l" colspan="10" style="color:var(--muted);padding-top:14px">Mostrando os 60 maiores desta lista. Use a busca para achar os demais.</td></tr>`;
  document.getElementById("tb").innerHTML=h+"</tbody>";
}

<script>
(function(){
window.FILTROS={};
  document.querySelectorAll("#lnk_portal,#lnk_portal2").forEach(a=>a.href=window.PORTAL_URL);
  const D=window.DADOS, gestor=!(D&&D.meuPainel&&D.meuPainel.usuario&&D.meuPainel.usuario.gestor===false);
  const ABAS=["resumo","devedores","cobradoras","meu-painel"], permitidas=gestor?ABAS:["meu-painel"];
  document.querySelectorAll("#nav a").forEach(a=>{if(!permitidas.includes(a.dataset.aba))a.hidden=true});
  const host=document.getElementById("abas"), frames={};
  // tema
  let t="claro";try{t=localStorage.getItem("cr-tema")||"claro"}catch(e){}
  window.TEMA=t;
  function aplicar(t){window.TEMA=t;document.body.classList.toggle("escuro",t==="escuro");
    document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t?"true":"false"));
    try{localStorage.setItem("cr-tema",t)}catch(e){}
    Object.values(frames).forEach(f=>{try{f.contentWindow.tema&&f.contentWindow.tema(t)}catch(e){}})}
  document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>aplicar(b.dataset.t)));
  aplicar(t);
  // abas (carrega cada uma na primeira visita)
  const DEMO_ON=new URLSearchParams(location.search).has("demo");
  if(!D&&!DEMO_ON){host.innerHTML='<div class="semdados"><b>O painel ainda não recebeu os dados.</b><br>O app precisa trocar o marcador <code>/*__DADOS_JSON__*/null</code> pelo JSON da view (ver contrato no projeto).<br><span>Para ver o layout com dados fictícios, abra com <code>?demo=1</code> no fim do endereço.</span></div>';document.getElementById("filtros").hidden=true;return}
  function abrir(){
    let a=(location.hash||"").slice(1);if(!permitidas.includes(a))a=gestor?"resumo":"meu-painel";
    if(!frames[a]){const f=document.createElement("iframe");f.title=a;
      f.srcdoc='<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'+document.getElementById("t_css").innerHTML+document.getElementById("t_"+a).innerHTML+'</html>';
      f.addEventListener("load",()=>{try{f.contentWindow.aplicarFiltros&&f.contentWindow.aplicarFiltros(window.FILTROS)}catch(e){}});
      host.appendChild(f);frames[a]=f}
    Object.entries(frames).forEach(([k,f])=>f.hidden=k!==a);
    document.querySelectorAll("#nav a").forEach(x=>x.dataset.aba===a?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current"));
  }
  addEventListener("hashchange",abrir);abrir();
  // ---------- filtros ----------
  const FK=["canal","grupo","marca","cobrador","sv","neg"];
  const DEMO={canal:["Franquias","Multimarcas","E-commerce"],grupo:["Shoes & Bags"],marca:["Arezzo","Schutz","Anacapri","Vicenza","Alexandre Birman","Brizza"],
    cobrador:["Ana Ribeiro","Bruna Teixeira","Carla Moraes","Maria Eduarda Albuquerque Vasconcellos","SEM NOME (047)","SEM COBRADOR"],sv:["Vencido","A vencer"],neg:[["S","Sim"],["N","Não"]]};
  const OP=(D&&D.filtros)||DEMO, q=new URLSearchParams(location.search);
  FK.forEach(k=>{const sel=document.getElementById("f_"+k),ops=(OP[k]||[]).map(o=>Array.isArray(o)?o:[o,o]);
    if(k==="cobrador")ops.sort((x,y)=>(x[0]==="SEM COBRADOR")-(y[0]==="SEM COBRADOR"));
    sel.innerHTML='<option value="">Todos</option>'+ops.map(([v,t])=>`<option value="${String(v).replace(/"/g,"&quot;")}" title="${String(t).replace(/"/g,"&quot;")}">${String(t).length>34?String(t).slice(0,33)+"…":t}</option>`).join("");
    const v=q.get(k)||"";if(v)sel.value=v;window.FILTROS[k]=sel.value;sel.classList.toggle("on",!!sel.value);
    sel.addEventListener("change",mudou)});
  function mudou(){FK.forEach(k=>{const s=document.getElementById("f_"+k);window.FILTROS[k]=s.value;s.classList.toggle("on",!!s.value)});
    if(D){ // dados reais: o app.py recalcula o JSON com os filtros da URL
      const p=new URLSearchParams();FK.forEach(k=>{if(window.FILTROS[k])p.set(k,window.FILTROS[k])});
      location.href=location.pathname+(p.toString()?"?"+p:"")+location.hash;return}
    Object.values(frames).forEach(f=>{try{f.contentWindow.aplicarFiltros&&f.contentWindow.aplicarFiltros(window.FILTROS)}catch(e){}})}
  document.getElementById("f_limpar").onclick=()=>{FK.forEach(k=>document.getElementById("f_"+k).value="");mudou()};
  if(!D)document.getElementById("f_nota").textContent="Modo demonstração (?demo=1), dados fictícios: aqui os filtros mexem em Devedores (canal, marca, cobrador e negociado), Cobradoras e Meu painel (cobrador). Com os dados reais, valem para todas as abas.";
  if(!gestor)document.getElementById("f_cobrador").closest("label").hidden=true;
  Object.values(frames).forEach(f=>{try{f.contentWindow.aplicarFiltros&&f.contentWindow.aplicarFiltros(window.FILTROS)}catch(e){}});
})();
</script>
